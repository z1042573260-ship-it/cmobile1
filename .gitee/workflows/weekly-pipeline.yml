# ============================================================
# 新版 Gitee Go 流水线（GitHub Actions 风格）
# 放置路径：仓库根目录 .gitee/workflows/weekly-pipeline.yml
#          （注意不是 .workflow/ —— 那是 2022 年已下线的旧版 Beta 格式）
#
# 密钥配置：仓库 → 管理 → WebHooks → Gitee Go → 环境变量
#   勾选「敏感信息」的那几项：TIDB_DATABASE_URL / ZHIPU_API_KEY /
#   XFYUN_API_KEY / XFYUN_API_SECRET / AMAP_KEY / EMAIL_PASSWORD
#   引用方式统一用 ${{ secrets.XXX }}，写在 job 的 env 里，按需注入。
# ============================================================
name: weekly-pipeline

on:
  schedule:
    # Gitee Go 的 cron 按 UTC 计：北京周一 09:15 == UTC 周一 01:15
    - cron: '15 1 * * 1'
  workflow_dispatch:   # 允许在页面手动点「运行」

jobs:
  pipeline:
    runs-on: ubuntu-latest

    # 实测单区县约 68 秒，13 区县 × 7 爬虫 + AI 分析约 2~2.5 小时。
    # 免费版每月 1000 核分（≈2C4G 跑 500 分钟），每周跑一次会逼近额度，
    # 这里给足 3 小时上限，超了直接失败，避免无限占用额度。
    timeout-minutes: 180

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
          pip install -r requirements.txt

      # playwright 只装 pip 包不会带浏览器内核，
      # 用到时运行期会报 "Executable doesn't exist"。
      # 如果确认代码没用到 playwright，可以把这一步和 requirements 里的该行一起删掉，
      # 能省下好几分钟安装时间。
      - name: 安装 Playwright 浏览器
        run: python -m playwright install --with-deps chromium

      # 只打印长度，不打印内容，避免密钥进日志
      - name: 诊断环境变量
        env:
          TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          echo "LEN TIDB=${#TIDB_DATABASE_URL} ZHIPU=${#ZHIPU_API_KEY} AMAP=${#AMAP_KEY} EMAIL=${#EMAIL_PASSWORD}"
          if [ -z "$TIDB_DATABASE_URL" ]; then
            echo "::error::TIDB_DATABASE_URL 为空 —— 请到 管理→WebHooks→Gitee Go→环境变量 里配置"
            exit 1
          fi

      - name: 运行完整管线
        env:
          TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
          XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: python crawler/scheduler.py
