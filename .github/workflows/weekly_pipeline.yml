# ============================================================
# 每周自动化管线：爬虫 → 汇总 → AI分析 → 坐标补全 → 入库 TiDB
#                    → 导出大屏 JSON → 提交仓库（触发 Pages 自动部署）→ 周报邮件
#
# 触发：北京时间每周一 09:15（UTC 周一 01:15）+ 手动触发
# 前置：仓库 Settings → Secrets and variables → Actions 配置：
#   TIDB_DATABASE_URL  完整 TiDB 连接串（含密码，ssl_ca=config/tidb_ca.pem 相对路径）
#   ZHIPU_API_KEY      智谱 GLM API Key（glm-4-flash 免费）
#   XFYUN_API_KEY / XFYUN_API_SECRET  讯飞星火（坐标搜索补全）
#   AMAP_KEY           高德 Web 服务 Key（坐标补全；本地读 processor/.amap_key 兜底）
#   EMAIL_PASSWORD     QQ 邮箱授权码（周报邮件；不配则跳过发信）
# ============================================================
name: 每周自动化管线

on:
  schedule:
    - cron: '15 1 * * 1'   # UTC 周一 01:15 = 北京周一 09:15
  workflow_dispatch: {}    # 仓库 Actions 页可手动触发

permissions:
  contents: write          # 允许提交导出数据回仓库（触发 Pages 重新部署）

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # 智谱限流 ~1请求/分钟，全量分析约 50 分钟，总时长 ~1.5h
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install --quiet -r requirements.txt

      - name: 运行完整管线（爬虫→AI→坐标→入库→导出→邮件）
        env:
          TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
          XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python crawler/scheduler.py

      - name: 提交导出数据
        run: |
          git config user.name "pipeline-bot"
          git config user.email "actions@github.com"
          git add frontend/data/dashboard_data.json frontend/data/report_data.json frontend/data/workbuddy.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): 自动更新大屏数据 $(date +'%Y-%m-%d %H:%M')"
            git push
          else
            echo "数据无变化，跳过提交"
          fi

      # 提交 AI 分析断点（失败也提交）：ai_pipeline 每成功一条即落盘 checkpoint，
      # 中断后下次 checkout 自动带上，按 _source_db_id 跳过已分析、只补未分析的。
      # /data/ 被 gitignore 忽略，需 -f 强制提交；仅这一个 checkpoint 文件入仓库。
      - name: 提交断点（失败也提交，保证下次可续跑）
        if: always()
        run: |
          git config user.name "pipeline-bot"
          git config user.email "actions@github.com"
          git add -f data/unified_intelligence.checkpoint.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): 更新 AI 分析断点 $(date +'%Y-%m-%d %H:%M')"
            git push
          else
            echo "断点无变化"
          fi

  # 部署到 GitHub Pages（frontend/ 目录）。
  # Pages 设置：Settings → Pages → Source 选 "GitHub Actions"（不是 Deploy from a branch，
  # 分支部署只支持根目录或 /docs，不支持 /frontend）
  deploy:
    needs: pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码（含最新数据 JSON）
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传 frontend/ 为 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
