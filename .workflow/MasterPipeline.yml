# ============================================================
# Gitee Go 每周自动化管线（国内 CI，可访问政务网站）
# 触发：定时（北京时间周一 09:15）+ 手动触发
#
# 【密钥方案】仓库根目录 .env.ci（从本地 .env 复制，仓库已设为私有）
#   config/settings.py 的 load_dotenv 会自动读取 .env 文件 → 无需 Gitee 变量注入
#   密钥不进 workflow、不依赖 Gitee 变量系统（社区版变量注入不生效）
#   GITEE_PUSH_TOKEN 用于把大屏数据 push 回仓库（Gitee Go 无内置凭据）
# ============================================================
version: '1.0'
name: weekly-pipeline
displayName: 每周自动化管线（爬虫→AI→坐标→入库→导出→邮件→落仓）
triggers:
  trigger: auto
  schedule:
    # 北京时间每周一 09:15（Gitee cron: 秒 分 时 日 月 星期(1=周日) 年；周一=2）
    - cron: '0 15 9 ? * 2 *'
stages:
  - name: pipeline
    displayName: 运行完整管线
    strategy: naturally
    trigger: auto
    steps:
      - step: build@python
        name: run_pipeline
        displayName: 爬虫→AI→坐标补全→入库→导出→邮件
        pythonVersion: '3.10'
        commands:
          - pip3 config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
          - pip3 install --quiet -r requirements.txt
          # 密钥从 .env.ci 加载（settings.py load_dotenv 读 .env）
          - cp .env.ci .env
          # 诊断：确认 .env 已就位且 DB 连接串非空（不打印内容）
          - test -f .env && echo "OK .env 存在" || echo "FAIL .env 缺失"
          - grep -q '^TIDB_DATABASE_URL=.' .env && echo "OK TIDB_DATABASE_URL 有值" || echo "FAIL TIDB 为空"
          - python3 crawler/scheduler.py
          # 落仓：大屏数据 + AI 断点 push 给 GitHub（GitHub Pages 大屏即更新）；
          # 数据已入 TiDB，push 失败不中断流水线（远端有新提交时下次再同步）
          - git config user.email "pipeline@cmobile1.local"
          - git config user.name "gitee-pipeline"
          - git add frontend/data/dashboard_data.json frontend/data/report_data.json frontend/data/workbuddy.json data/unified_intelligence.checkpoint.json
          - git diff --cached --quiet || git commit -m "chore(data): 自动更新大屏数据（Gitee 跑完推 GitHub）$(date '+%Y-%m-%d %H:%M')"
          - TOKEN=$(grep '^GITHUB_PUSH_TOKEN=' .env | cut -d= -f2-)
          - test -n "$TOKEN" && git push "https://z1042573260-ship-it:${TOKEN}@github.com/z1042573260-ship-it/cmobile1.git" HEAD:main || echo "PUSH_SKIP 无令牌/远端有新提交，数据已在 TiDB，下次同步"
