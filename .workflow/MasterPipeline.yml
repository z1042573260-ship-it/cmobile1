# ============================================================
# Gitee Go 每周自动化管线（国内 CI，可访问政务网站）
# 触发：定时（北京时间周一 09:15）+ 手动触发
#
# 【密钥方案】仓库根目录 .env.ci（从本地 .env 复制，仓库已设为私有）
#   config/settings.py 的 load_dotenv 会自动读取 .env 文件 → 无需 Gitee 变量注入
#   GITHUB_PUSH_TOKEN 例外：GitHub PAT（ghp_ 开头）会被 GitHub Push Protection 判定为
#   密钥泄露拦截 → 存 Gitee 仓库变量（下方 variables 声明注入），不写进任何仓库文件
# 【大屏同步】跑完用 scripts/sync_dashboard_to_github.py（GitHub Contents API）写文件，
#   不用 git push —— 两仓库历史分叉会必然被拒（2026-09-10 实测 ! [rejected]）
# ============================================================
version: '1.0'
name: weekly-pipeline
displayName: 每周自动化管线（爬虫→AI→坐标→入库→导出→邮件→落仓）
triggers:
  trigger: auto
  schedule:
    # 北京时间每周一 09:15（Gitee cron: 秒 分 时 日 月 星期(1=周日) 年；周一=2）
    - cron: '0 15 9 ? * 2 *'
variables:
  # Gitee 仓库变量声明（不在此声明则不会注入构建环境，官方行为）
  global:
    - GITHUB_PUSH_TOKEN   # Gitee 个人设置→仓库变量 配置；值=GitHub PAT（勾 repo）
stages:
  - name: pipeline
    displayName: 运行完整管线
    strategy: naturally
    trigger: auto
    steps:
      - step: build@python
        name: run_pipeline
        displayName: 爬虫→AI→坐标补全→入库→导出→邮件
        pythonVersion: '3.10'
        commands:
          - pip3 config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
          - pip3 install --quiet -r requirements.txt
          # 密钥从 .env.ci 加载（settings.py load_dotenv 读 .env）
          - cp .env.ci .env
          # 诊断：确认 .env 已就位且 DB 连接串非空（不打印内容）
          - test -f .env && echo "OK .env 存在" || echo "FAIL .env 缺失"
          - grep -q '^TIDB_DATABASE_URL=.' .env && echo "OK TIDB_DATABASE_URL 有值" || echo "FAIL TIDB 为空"
          - python3 crawler/scheduler.py
          # 大屏数据同步给 GitHub（GitHub Pages 自动更新）
          # 【为什么不用 git push】GitHub 与 Gitee 两仓库历史分叉（内容相同、commit hash 不同），
          #   从 Gitee 容器 push 必然 `! [rejected] (fetch first)`；且 data/ 在 .gitignore 里，
          #   `git add data/xxx.checkpoint.json` 会整条失败。
          # 改用 GitHub Contents API 直接写文件内容（自动基于远端 HEAD 建提交）→ 永不冲突。
          # 令牌 GITHUB_PUSH_TOKEN 来自 Gitee 仓库变量；同步失败不中断流水线（数据已在 TiDB）
          - python3 scripts/sync_dashboard_to_github.py || echo "SYNC_SKIP 同步失败，数据已在 TiDB"
