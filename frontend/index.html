<script>
// ====== 加载大屏数据 → 更新统计卡片 + 初始化地图和图表 ======
(function() {
    function updateStats(data) {
        var s = data.summary;
        document.getElementById("statRed").textContent = s.red_warning;
        document.getElementById("statYellow").textContent = s.yellow_warning;
        document.getElementById("statDistricts").textContent = s.district_count;
    }
    function onDataReady(data) {
        // data 为 null 时 getData() 返回完整兜底数据
        window.DASHBOARD_DATA = data;
        updateStats(getData());
        initAllCharts();
    }
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "data/dashboard_data.json", true);
    xhr.onload = function() {
        if (xhr.status === 200) {
            try {
                onDataReady(JSON.parse(xhr.responseText));
            } catch(e) {
                onDataReady(null);
            }
        } else {
            onDataReady(null);
        }
    };
    xhr.onerror = function() { onDataReady(null); };
    xhr.send();
    // 加载 AI 分析详情库（workbuddy.json，230 条全字段项目详情；详情卡片展示用，失败静默）
    // 数据库未导入前：用前 10 条构建预警点（坐标=区县中心+微偏移），覆盖 map_points；导入后去掉这段
    var xhr2 = new XMLHttpRequest();
    xhr2.open("GET", "data/workbuddy.json", true);
    xhr2.onload = function() {
        if (xhr2.status === 200) {
            try {
                var wb = JSON.parse(xhr2.responseText);
                window.DASHBOARD_WORKBUDDY = Array.isArray(wb) ? wb : Object.values(wb);
                // 已导入数据库真实坐标：不再用 workbuddy 前10条覆盖 map_points（applyWorkbuddyPoints 函数保留备用）
            } catch(e) { /* 静默 */ }
        }
    };
    xhr2.onerror = function() { /* 静默 */ };
    xhr2.send();
    function applyWorkbuddyPoints(list) {
        function apply() {
            if (!window.DASHBOARD_DATA || !window.getDistrictCenter) return false;
            // 中下列表面板数据：覆盖前保留原始 map_points（dashboard_data.json 13 条）
            if (!window.DASHBOARD_DATA.map_points_original) {
                window.DASHBOARD_DATA.map_points_original = (window.DASHBOARD_DATA.map_points || []).slice();
            }
            // 区县均衡：每区县取最高优先级 1 条，再按优先级降序取前 10（避免全挤一个区县）
            var byDistrict = {};
            list.forEach(function(it) {
                var cur = byDistrict[it.district];
                if (!cur || (it.priority || 0) > (cur.priority || 0)) byDistrict[it.district] = it;
            });
            var top = Object.keys(byDistrict).map(function(k) { return byDistrict[k]; })
                .sort(function(a, b) { return (b.priority || 0) - (a.priority || 0); })
                .slice(0, 10);
            window.DASHBOARD_DATA.map_points = top.map(function(it, i) {
                var c = window.getDistrictCenter(it.district);
                var isRed = /红/.test(it.warning_level || '');
                // 同区县多条：中心 + 微小偏移错开（避免 3D/2D 去重合并）
                return {
                    name: it.project_name,
                    value: [c[0] + (i % 3) * 0.001, c[1] + Math.floor(i / 3) * 0.001, 4],
                    district: it.district,
                    project_type: it.project_type,
                    stage: it.status,
                    category: isRed ? 'red' : 'yellow',
                    warning: it.warning_level || (isRed ? '红色预警' : '黄色预警'),
                };
            });
            return true;
        }
        if (!apply()) {
            // dashboard_data.json 可能尚未加载完，轮询等待
            var tries = 0;
            var timer = setInterval(function() {
                tries++;
                if (apply() || tries > 20) clearInterval(timer);
            }, 100);
        }
    }
    // ====== 自动刷新：每 5 分钟检测 dashboard_data.json 更新 → 刷新图表+点位 ======
    (function() {
        var lastUpdated = null;
        function pollDashboard() {
            var xhr = new XMLHttpRequest();
            // cache-buster 防浏览器缓存旧文件
            xhr.open("GET", "data/dashboard_data.json?t=" + Date.now(), true);
            xhr.onload = function() {
                if (xhr.status !== 200) return;
                try {
                    var nd = JSON.parse(xhr.responseText);
                    var stamp = (nd.meta && nd.meta.updated_at) || '';
                    if (stamp && stamp !== lastUpdated) {
                        lastUpdated = stamp;
                        if (!window.DASHBOARD_DATA) { window.DASHBOARD_DATA = nd; return; } // 首轮不重复刷新
                        console.log('[auto-refresh] dashboard_data 更新:', stamp);
                        window.DASHBOARD_DATA = nd;
                        if (typeof window.refreshAllCharts === 'function') window.refreshAllCharts();
                        if (window.yantaiMapChart && typeof window.yantaiMapChart.reloadPoints === 'function') {
                            window.yantaiMapChart.reloadPoints();
                        }
                    }
                } catch(e) { /* 静默 */ }
            };
            xhr.onerror = function() { /* 静默 */ };
            xhr.send();
        }
        // 首轮：记录当前版本；之后每 5 分钟检测
        setTimeout(function() {
            var x = new XMLHttpRequest();
            x.open("GET", "data/dashboard_data.json?t=" + Date.now(), true);
            x.onload = function() {
                if (x.status === 200) {
                    try { lastUpdated = (JSON.parse(x.responseText).meta || {}).updated_at || ''; }
                    catch(e) {}
                }
                setInterval(pollDashboard, 5 * 60 * 1000);
            };
            x.onerror = function() { setInterval(pollDashboard, 5 * 60 * 1000); };
            x.send();
        }, 1000);
    })();
})();
</script>

<!-- autofit: 1920×1080 设计稿自动缩放（对齐广东大屏） -->
<script>
(function() {
	var dw = 1920, dh = 1080;
	var el = document.body;

	el.style.width = dw + 'px';
	el.style.height = dh + 'px';
	el.style.position = 'absolute';
	el.style.overflow = 'hidden';

	function keepFit() {
		var scaleX = window.innerWidth / dw;
		var scaleY = window.innerHeight / dh;
		var isPhone = window.innerWidth < 900;   // 手机/小平板
		if (isPhone) {
			// 手机（横屏展览为主）：等比缩放 + 居中 —— 比例保真、面板位置与 PC 完全一致
			var scale = Math.min(scaleX, scaleY);
			el.style.transform = 'scale(' + scale + ')';
			el.style.left = Math.round((window.innerWidth - dw * scale) / 2) + 'px';
			el.style.top = Math.round((window.innerHeight - dh * scale) / 2) + 'px';
		} else {
			// PC：保持原逻辑（拉伸填满，无黑边）—— 不动
			el.style.transform = 'scale(' + scaleX + ', ' + scaleY + ')';
			el.style.left = '0px';
			el.style.top = '0px';
		}
		el.style.transformOrigin = '0 0';
	}

	keepFit();
	window.addEventListener('resize', keepFit);
})();
</script>
